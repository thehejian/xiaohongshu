  <text x="30" y="115" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">拉穆希：没事没事，热身而已，战术还在磨合</text>
</g>

<g transform="translate(62, 300)">

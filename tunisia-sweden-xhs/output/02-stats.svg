<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <radialGradient id="bg" cx="50%" cy="40%" r="70%">
    <stop offset="0%" stop-color="#FAF7F2"/>
    <stop offset="100%" stop-color="#F5F0E8"/>
  </radialGradient>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.08"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<circle cx="80" cy="80" r="90" fill="#FEE2E2" opacity="0.2"/>
<circle cx="924" cy="924" r="100" fill="#FEF3C7" opacity="0.15"/>

<rect x="62" y="30" width="900" height="80" rx="35" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="512" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="30" font-weight="800" fill="#1E293B">📊 崩溃时间线 · 数字不会骗人</text>

<g transform="translate(62, 140)">
  <rect x="0" y="0" width="900" height="130" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>

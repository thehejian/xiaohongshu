  <rect x="0" y="0" width="6" height="130" rx="3" fill="#DC2626"/>
  <text x="30" y="45" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" font-weight="600" fill="#DC2626">正赛 · 2026世界杯F组首轮</text>
  <text x="30" y="85" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="40" font-weight="900" fill="#DC2626">瑞典 5-1 突尼斯</text>
  <text x="30" y="115" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">拉穆希：……（说都不会话了）</text>
</g>

<rect x="62" y="470" width="900" height="80" rx="20" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="512" y="505" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="24" font-weight="800" fill="#DC2626">两场统计：10球丢失  1次下课</text>
<text x="512" y="535" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">效率之高，令人叹为观止</text>

<g transform="translate(62, 580)">
  <rect x="0" y="0" width="900" height="200" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#1E293B">世界杯历史上赛中解雇的主帅</text>
  <text x="30" y="80" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">1998 · 沙特 · 佩雷拉（2场后）</text>
  <text x="30" y="115" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">1998 · 韩国 · 车范根（2场后）</text>
  <text x="30" y="150" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">1998 · 突尼斯 · 卡斯佩尔恰克（2场后）</text>
  <text x="30" y="185" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#DC2626">2026 · 突尼斯 · 拉穆希（1场后）← 新纪录</text>

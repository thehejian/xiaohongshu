<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#FAF7F2"/>
  <rect x="0" y="0" width="1024" height="8" fill="#E8655A"/>

  <g filter="url(#shadow)">
    <rect x="80" y="200" width="864" height="560" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <text x="512" y="300" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="52" font-weight="700" fill="#1E293B" letter-spacing="2">Fable 5 模型上线</text>
  <line x1="380" y1="330" x2="644" y2="330" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

  <text x="512" y="400" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="32" fill="#E8655A" font-weight="600">"超过我们所有已公开模型的能力"</text>
  <text x="512" y="450" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="24" fill="#94A3B8">— Anthropic 官方说明</text>

  <g transform="translate(130, 520)">
    <rect x="0" y="0" width="230" height="80" fill="#FEF2F2"/>
    <text x="115" y="34" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="22" fill="#E8655A" font-weight="700">Mythos 级</text>
    <text x="115" y="62" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="18" fill="#64748B">最高能力等级</text>
  </g>
  <g transform="translate(397, 520)">
    <rect x="0" y="0" width="230" height="80" fill="#F0F9FF"/>
    <text x="115" y="34" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="22" fill="#0EA5E9" font-weight="700">1M 上下文</text>
    <text x="115" y="62" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="18" fill="#64748B">超大窗口</text>
  </g>
  <g transform="translate(664, 520)">
    <rect x="0" y="0" width="230" height="80" fill="#F0FDF4"/>
    <text x="115" y="34" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="22" fill="#10B981" font-weight="700">通用可用</text>
    <text x="115" y="62" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="18" fill="#64748B">已开放使用</text>
  </g>

  <text x="512" y="690" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="24" fill="#64748B">更新到 v2.1.170 即可使用</text>
  <text x="942" y="980" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="18" fill="#CBD5E1">2 / 6</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#FAF7F2"/>
  <rect x="0" y="0" width="1024" height="8" fill="#E8655A"/>

  <g filter="url(#shadow)">
    <rect x="80" y="200" width="864" height="560" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <text x="512" y="290" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="52" font-weight="700" fill="#1E293B" letter-spacing="2">动态工作流</text>
  <line x1="380" y1="320" x2="644" y2="320" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

  <text x="512" y="390" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="30" fill="#475569" letter-spacing="1">子Agent 可以嵌套子Agent</text>
  <text x="512" y="440" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="30" fill="#475569" letter-spacing="1">100个Agent同时并行干活</text>

  <line x1="200" y1="480" x2="824" y2="480" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6,4"/>

  <g transform="translate(140, 520)">
    <rect x="0" y="0" width="744" height="50" fill="#E8655A" opacity="0.08"/>
    <text x="20" y="32" font-family="'PingFang SC', sans-serif" font-size="22" fill="#1E293B" font-weight="600">主Agent：部署新功能</text>
  </g>
  <g transform="translate(170, 580)">
    <rect x="0" y="0" width="340" height="50" fill="#0EA5E9" opacity="0.08"/>
    <text x="20" y="32" font-family="'PingFang SC', sans-serif" font-size="20" fill="#1E293B">→ 子Agent：写测试</text>
  </g>
  <g transform="translate(540, 580)">
    <rect x="0" y="0" width="340" height="50" fill="#10B981" opacity="0.08"/>
    <text x="20" y="32" font-family="'PingFang SC', sans-serif" font-size="20" fill="#1E293B">→ 子Agent：部署验证</text>
  </g>

  <text x="512" y="700" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="20" fill="#94A3B8">v2.1.172 起支持嵌套，最多5层</text>
  <text x="942" y="980" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="18" fill="#CBD5E1">3 / 6</text>
</svg>
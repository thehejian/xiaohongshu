<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#FAF7F2"/>
  <rect x="0" y="0" width="1024" height="8" fill="#E8655A"/>

  <g filter="url(#shadow)">
    <rect x="80" y="200" width="864" height="560" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <text x="512" y="290" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="52" font-weight="700" fill="#1E293B" letter-spacing="2">定时任务 + Agent管理</text>
  <line x1="380" y1="320" x2="644" y2="320" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

  <g transform="translate(130, 370)">
    <rect x="0" y="0" width="764" height="75" fill="#E8655A" opacity="0.08"/>
<text x="28" y="34" font-family="'PingFang SC', sans-serif" font-size="26" fill="#E8655A" font-weight="700">Routines 定时任务</text>
    <text x="28" y="62" font-family="'PingFang SC', sans-serif" font-size="20" fill="#64748B">配置一次，按计划、API调用或事件触发自动运行</text>
  </g>

  <g transform="translate(130, 470)">
    <rect x="0" y="0" width="764" height="75" fill="#0EA5E9" opacity="0.08"/>
    <text x="28" y="34" font-family="'PingFang SC', sans-serif" font-size="26" fill="#0EA5E9" font-weight="700">Agent View 管理面板</text>
    <text x="28" y="62" font-family="'PingFang SC', sans-serif" font-size="20" fill="#64748B">统一管理所有会话 · 查看进度 · 查看日志</text>
  </g>

  <g transform="translate(130, 570)">
    <rect x="0" y="0" width="764" height="75" fill="#10B981" opacity="0.08"/>
    <text x="28" y="34" font-family="'PingFang SC', sans-serif" font-size="26" fill="#10B981" font-weight="700">Remote Control</text>
    <text x="28" y="62" font-family="'PingFang SC', sans-serif" font-size="20" fill="#64748B">手机/网页远程控制终端会话</text>
  </g>

  <g transform="translate(130, 670)">
    <rect x="0" y="0" width="764" height="50" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="512" y="32" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="22" fill="#94A3B8">每周依赖审计 · 每日PR审查 · CI失败分析</text>
  </g>

  <text x="942" y="980" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="18" fill="#CBD5E1">5 / 6</text>

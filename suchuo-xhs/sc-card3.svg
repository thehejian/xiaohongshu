<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="30%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="stroke">
      <feMorphology operator="dilate" radius="3" in="SourceAlpha" result="expanded"/>
      <feFlood flood-color="#000" flood-opacity="1" result="colored"/>
      <feComposite operator="in" in="colored" in2="expanded" result="stroked"/>
      <feMerge><feMergeNode in="stroked"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image href="sc-card-3_raw.png" x="0" y="0" width="1024" height="1024" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#overlay)"/>
</svg><text x="60" y="120" fill="#D8C58A" font-family="Source Han Serif SC" font-size="48" font-weight="700" filter="url(#stroke)">影响千年</text><line x1="60" y1="160" x2="964" y2="160" stroke="#D8C58A" stroke-opacity="0.4" stroke-width="1.5"/><text x="60" y="190" fill="#B59E60" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">四十九岁英年早逝</text><text x="60" y="236" fill="#B59E60" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">宇文泰亲撰墓志铭</text><text x="60" y="282" fill="#B59E60" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">称他是'我的萧何'</text><text x="60" y="328" fill="#B59E60" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">治国理念影响隋唐</text><text x="60" y="374" fill="#B59E60" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">贞观之治的根基在此</text><text x="944" y="984" fill="#B59E60" font-family="Source Han Serif SC" font-size="18" font-weight="300" text-anchor="end" opacity="0.5">card3</text>
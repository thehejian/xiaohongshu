<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
<defs><linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FAF7F2"/><stop offset="100%" stop-color="#F5F0E8"/></linearGradient></defs>
<rect width="800" height="800" fill="url(#bgG)"/><circle cx="64.0" cy="64.0" r="60" fill="#D1FAE5" opacity="0.3"/><circle cx="736.0" cy="96.0" r="50" fill="#FEF3C7" opacity="0.3"/><circle cx="64.0" cy="704.0" r="70" fill="#FEE2E2" opacity="0.2"/><circle cx="736.0" cy="624.0" r="80" fill="#D1FAE5" opacity="0.2"/>

<text x="400" y="65" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="34" font-weight="800" fill="#1E293B">父与子</text>
<text x="400" y="105" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="18" fill="#64748B">Zinedine vs Luca · 传奇与传承</text>

<g transform="translate(40, 150)">
  <rect x="0" y="0" width="340" height="280" rx="18" fill="#FFFFFF" stroke="#006233" stroke-width="2"/>
  <text x="170" y="45" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="28" font-weight="900" fill="#006233">齐达内</text>
  <line x1="30" y1="65" x2="310" y2="65" stroke="#D1FAE5" stroke-width="2"/>
  <text x="170" y="100" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#1E293B">法国传奇中场</text>
  <text x="170" y="135" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="16" fill="#64748B">1998世界杯冠军</text>
  <text x="170" y="165" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="16" fill="#64748B">2000欧洲杯冠军</text>
  <text x="170" y="195" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="16" fill="#64748B">2002欧冠天外飞仙</text>
  <text x="170" y="225" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="16" fill="#64748B">皇马主帅三连欧冠</text>
  <text x="170" y="260" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="14" fill="#94A3B8">🇫🇷 法国 · 中场 · 10号</text>
</g>

<g transform="translate(420, 150)">
  <rect x="0" y="0" width="340" height="280" rx="18" fill="#FFFFFF" stroke="#D4A843" stroke-width="2"/>
  <text x="170" y="45" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="28" font-weight="900" fill="#D4A843">卢卡</text>
  <line x1="30" y1="65" x2="310" y2="65" stroke="#FEF3C7" stroke-width="2"/>
  <text x="170" y="100" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#1E293B">阿尔及利亚门将</text>
  <text x="170" y="135" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="16" fill="#64748B">2025转籍阿尔及利亚</text>
  <text x="170" y="165" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="16" fill="#64748B">2026非洲杯3零封</text>
  <text x="170" y="195" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="16" fill="#64748B">2026世界杯大名单</text>
  <text x="170" y="225" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="16" fill="#64748B">格拉纳达俱乐部</text>
  <text x="170" y="260" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="14" fill="#94A3B8">🇩🇿 阿尔及利亚 · 门将 · 23号</text>
</g>

<text x="400" y="500" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#1E293B">"他的旅程是他的，我有我的旅程"</text>
<text x="400" y="540" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="18" fill="#64748B">—— Luca Zidane</text>

<g transform="translate(100, 590)">
  <rect x="0" y="0" width="600" height="70" rx="35" fill="#D1FAE5"/>
  <text x="300" y="32" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#059669">同一个姓氏，不同的传奇之路</text>
  <text x="300" y="56" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="15" fill="#059669">法国10号 → 阿尔及利亚23号</text>
</g>

<text x="400" y="740" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="16" fill="#94A3B8">传承 · 选择 · 走自己的路</text>


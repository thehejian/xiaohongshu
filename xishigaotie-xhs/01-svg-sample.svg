<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="6" fill="#F59E0B"/>

  <rect x="60" y="120" width="904" height="720" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="60" y="120" width="904" height="6" rx="3" fill="#F59E0B"/>

  <text x="512" y="230" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="60" font-weight="700" fill="#FFFFFF" letter-spacing="8">西十高铁</text>

  <line x1="380" y1="270" x2="644" y2="270" stroke="#334155" stroke-width="1"/>

  <text x="512" y="330" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="28" fill="#F59E0B" letter-spacing="4">西安 → 十堰</text>
  <text x="512" y="380" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="24" fill="#94A3B8" letter-spacing="2">穿越秦岭 · 350km/h</text>

  <line x1="200" y1="420" x2="824" y2="420" stroke="#1E293B" stroke-width="1"/>

  <g transform="translate(120, 460)">
    <rect x="0" y="0" width="6" height="70" fill="#F59E0B" opacity="0.5"/>
    <text x="24" y="28" font-family="'PingFang SC','STHeiti',sans-serif" font-size="26" fill="#FFFFFF" font-weight="600">全长 255.7km</text>
    <text x="24" y="58" font-family="'PingFang SC','STHeiti',sans-serif" font-size="20" fill="#94A3B8">西安东站至十堰东站</text>
  </g>

  <g transform="translate(120, 560)">
    <rect x="0" y="0" width="6" height="70" fill="#F59E0B" opacity="0.5"/>
    <text x="24" y="28" font-family="'PingFang SC','STHeiti',sans-serif" font-size="26" fill="#FFFFFF" font-weight="600">设计时速 350km</text>
    <text x="24" y="58" font-family="'PingFang SC','STHeiti',sans-serif" font-size="20" fill="#94A3B8">西安至武汉缩短至2.5h</text>
  </g>

  <g transform="translate(120, 660)">
    <rect x="0" y="0" width="6" height="70" fill="#F59E0B" opacity="0.5"/>
    <text x="24" y="28" font-family="'PingFang SC','STHeiti',sans-serif" font-size="26" fill="#FFFFFF" font-weight="600">全线设站 7座</text>
    <text x="24" y="58" font-family="'PingFang SC','STHeiti',sans-serif" font-size="20" fill="#94A3B8">西安东 · 蓝田 · 商洛西 · 山阳 · 漫川关 · 郧西 · 十堰东</text>
  </g>

  <rect x="310" y="770" width="404" height="44" rx="22" fill="#F59E0B" opacity="0.12"/>
  <text x="512" y="799" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#F59E0B" letter-spacing="2">秦岭南麓第一条高铁</text>

  <text x="942" y="980" text-anchor="end" font-family="sans-serif" font-size="14" fill="#334155">SVG 样卡</text>
</svg>
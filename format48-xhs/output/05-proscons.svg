<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#FAF7F2"/>
  <text x="512" y="80" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="32" fill="#1E293B" font-weight="bold">扩军48队：好与坏</text>
  <line x1="300" y1="100" x2="724" y2="100" stroke="#B8860B" stroke-width="2"/>

  <rect x="80" y="160" width="400" height="50" rx="10" fill="#059669" opacity="0.15"/>
  <text x="280" y="193" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" fill="#059669" font-weight="bold">✅ 好处</text>
  <rect x="544" y="160" width="400" height="50" rx="10" fill="#DC2626" opacity="0.15"/>
  <text x="744" y="193" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" fill="#DC2626" font-weight="bold">❌ 坏处</text>

  <text x="280" y="260" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#1E293B">更多国家参与</text>
  <text x="280" y="295" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#1E293B">小国圆梦世界杯</text>
  <text x="280" y="330" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#1E293B">佛得角、库拉索的故事</text>
  <text x="280" y="365" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#1E293B">亚洲8.5名额，国足机会大</text>

  <text x="744" y="260" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#1E293B">强弱悬殊极大</text>
  <text x="744" y="295" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#1E293B">7:1惨案变多</text>
  <text x="744" y="330" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#1E293B">小组第三能出线</text>
  <text x="744" y="365" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#1E293B">强队小组赛可能摸鱼</text>

  <line x1="512" y1="420" x2="512" y2="780" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="5,5"/>

  <text x="512" y="500" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#1E293B">比赛变多了</text>
  <text x="512" y="540" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#1E293B">冷门变少了</text>
  <text x="512" y="580" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#1E293B">世界杯更热闹了</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#FAF7F2"/>
  <text x="512" y="100" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="32" fill="#1E293B" font-weight="bold">关键数字</text>
  <line x1="350" y1="120" x2="674" y2="120" stroke="#B8860B" stroke-width="2"/>

  <text x="256" y="250" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="60" fill="#2563EB" font-weight="bold">48</text>
  <text x="256" y="290" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#94A3B8">参赛球队</text>

  <text x="512" y="250" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="60" fill="#059669" font-weight="bold">12</text>
  <text x="512" y="290" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#94A3B8">小组数量</text>

  <text x="768" y="250" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="60" fill="#B8860B" font-weight="bold">104</text>
  <text x="768" y="290" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#94A3B8">总比赛场次</text>

  <line x1="100" y1="330" x2="924" y2="330" stroke="#E2E8F0" stroke-width="1"/>

  <text x="256" y="430" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="60" fill="#DC2626" font-weight="bold">32</text>
  <text x="256" y="470" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#94A3B8">淘汰赛队伍</text>

  <text x="512" y="430" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="60" fill="#1E293B" font-weight="bold">8.5</text>
  <text x="512" y="470" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#94A3B8">亚洲名额</text>

  <text x="768" y="430" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="60" fill="#DC2626" font-weight="bold">+40</text>
  <text x="768" y="470" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#94A3B8">比2022年多</text>

  <rect x="150" y="580" width="724" height="80" rx="15" fill="#1E293B" opacity="0.05"/>
  <text x="512" y="618" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" fill="#1E293B" font-weight="bold">中国球迷：8.5个名额都救不了国足</text>
  <text x="512" y="650" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="16" fill="#94A3B8">印尼都进了，国足还没进</text>
</svg>
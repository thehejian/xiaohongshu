<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="30%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="stroke">
      <feMorphology operator="dilate" radius="3" in="SourceAlpha" result="expanded"/>
      <feFlood flood-color="#000" flood-opacity="1" result="colored"/>
      <feComposite operator="in" in="colored" in2="expanded" result="stroked"/>
      <feMerge><feMergeNode in="stroked"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image href="zcz-card-1_raw.png" x="0" y="0" width="1024" height="1024" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#overlay)"/>
</svg><text x="60" y="120" fill="#B8D4E3" font-family="Source Han Serif SC" font-size="48" font-weight="700" filter="url(#stroke)">圆周率</text><line x1="60" y1="160" x2="964" y2="160" stroke="#B8D4E3" stroke-opacity="0.4" stroke-width="1.5"/><text x="60" y="190" fill="#8BB8D0" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">圆周率精确到小数点后七位</text><text x="60" y="236" fill="#8BB8D0" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">3.1415926到3.1415927之间</text><text x="60" y="282" fill="#8BB8D0" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">这个纪录保持近千年</text><text x="60" y="328" fill="#8BB8D0" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">直到十五世纪才被打破</text><text x="60" y="374" fill="#8BB8D0" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">领先世界千年的精度</text><text x="944" y="984" fill="#8BB8D0" font-family="Source Han Serif SC" font-size="18" font-weight="300" text-anchor="end" opacity="0.5">card1</text>
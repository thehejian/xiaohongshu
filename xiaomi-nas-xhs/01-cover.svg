<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <rect x="0" y="0" width="1024" height="6" fill="url(#accent)"/>

  <rect x="60" y="180" width="904" height="580" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="60" y="180" width="904" height="6" rx="3" fill="url(#accent)"/>

  <text x="512" y="310" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="6">Xiaomi 智能存储</text>
  <text x="512" y="400" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="40" fill="#F59E0B" letter-spacing="8">小米首款NAS</text>

  <line x1="380" y1="460" x2="644" y2="460" stroke="#334155" stroke-width="1"/>

  <text x="512" y="530" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="28" fill="#94A3B8" letter-spacing="4">2026.06.24 正式发布</text>
  <text x="512" y="580" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="24" fill="#64748B" letter-spacing="2">家庭私有云 · 开箱即用</text>

  <rect x="340" y="640" width="344" height="48" rx="24" fill="url(#accent)"/>
  <text x="512" y="672" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="22" fill="#FFFFFF" font-weight="600" letter-spacing="2">4TB 套装 2299元起</text>

  <text x="512" y="730" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="18" fill="#475569">预约中 · 众筹价</text>
  <text x="942" y="980" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="16" fill="#334155">1 / 6</text>
</svg>
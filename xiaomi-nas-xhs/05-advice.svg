<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="6" fill="url(#accent)"/>

  <rect x="60" y="120" width="904" height="720" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="60" y="120" width="904" height="6" rx="3" fill="url(#accent)"/>

  <text x="512" y="210" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="4">购买建议</text>
  <line x1="380" y1="240" x2="644" y2="240" stroke="#334155" stroke-width="1"/>

  <!-- Recommend -->
  <g transform="translate(80, 300)">
    <rect x="0" y="0" width="864" height="110" rx="16" fill="#1C1F2E" stroke="#F59E0B" stroke-width="1"/>
    <rect x="0" y="0" width="48" height="110" rx="16" fill="url(#accent)"/>
    <rect x="0" y="0" width="48" height="110" fill="url(#accent)"/>
    <text x="512" y="40" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="24" fill="#F59E0B" font-weight="600" letter-spacing="2">推荐：小米全家桶用户</text>
    <text x="512" y="72" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="18" fill="#94A3B8" letter-spacing="1">手机 + 摄像头 + 电视联动体验极佳</text>
    <rect x="370" y="90" width="124" height="2" fill="#F59E0B" opacity="0.5"/>
  </g>

  <g transform="translate(80, 440)">
    <rect x="0" y="0" width="864" height="110" rx="16" fill="#1C1F2E" stroke="#3B82F6" stroke-width="1"/>
    <rect x="0" y="0" width="48" height="110" rx="16" fill="#3B82F6"/>
    <rect x="0" y="0" width="48" height="110" fill="#3B82F6"/>
    <text x="512" y="40" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="24" fill="#60A5FA" font-weight="600" letter-spacing="2">推荐：普通家庭用户</text>
    <text x="512" y="72" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="18" fill="#94A3B8" letter-spacing="1">手机空间不够 · 云盘太贵 · 监控没地存</text>
    <rect x="370" y="90" width="124" height="2" fill="#3B82F6" opacity="0.5"/>
  </g>

  <g transform="translate(80, 580)">
    <rect x="0" y="0" width="864" height="110" rx="16" fill="#1C1F2E" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="0" width="48" height="110" rx="16" fill="#475569"/>
    <rect x="0" y="0" width="48" height="110" fill="#475569"/>
    <text x="512" y="40" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="24" fill="#94A3B8" font-weight="600" letter-spacing="2">慎重：数码极客 / Docker玩家</text>
    <text x="512" y="72" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="18" fill="#64748B" letter-spacing="1">系统封闭，建议选绿联、群晖等传统NAS</text>
    <rect x="370" y="90" width="124" height="2" fill="#475569" opacity="0.5"/>
  </g>

  <text x="942" y="980" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="16" fill="#334155">5 / 6</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="6" fill="url(#accent)"/>

  <rect x="60" y="120" width="904" height="720" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="60" y="120" width="904" height="6" rx="3" fill="url(#accent)"/>

  <text x="512" y="210" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="4">四大核心功能</text>
  <line x1="380" y1="240" x2="644" y2="240" stroke="#334155" stroke-width="1"/>

  <g transform="translate(100, 290)">
    <text x="0" y="30" font-family="'PingFang SC', sans-serif" font-size="18" fill="#F59E0B" font-weight="600" letter-spacing="2">01</text>
    <text x="60" y="30" font-family="'PingFang SC', sans-serif" font-size="26" fill="#FFFFFF" font-weight="600" letter-spacing="1">手机相册自动备份</text>
    <text x="60" y="65" font-family="'PingFang SC', sans-serif" font-size="20" fill="#94A3B8">原图无损自动备份，AI智能分类生成家庭相册</text>
    <line x1="0" y1="90" x2="824" y2="90" stroke="#1E293B" stroke-width="1"/>
  </g>

  <g transform="translate(100, 400)">
    <text x="0" y="30" font-family="'PingFang SC', sans-serif" font-size="18" fill="#60A5FA" font-weight="600" letter-spacing="2">02</text>
    <text x="60" y="30" font-family="'PingFang SC', sans-serif" font-size="26" fill="#FFFFFF" font-weight="600" letter-spacing="1">米家生态深度联动</text>
    <text x="60" y="65" font-family="'PingFang SC', sans-serif" font-size="20" fill="#94A3B8">摄像头录像自动循环保存，免云存储会员费</text>
    <line x1="0" y1="90" x2="824" y2="90" stroke="#1E293B" stroke-width="1"/>
  </g>

  <g transform="translate(100, 510)">
    <text x="0" y="30" font-family="'PingFang SC', sans-serif" font-size="18" fill="#34D399" font-weight="600" letter-spacing="2">03</text>
    <text x="60" y="30" font-family="'PingFang SC', sans-serif" font-size="26" fill="#FFFFFF" font-weight="600" letter-spacing="1">家庭影音娱乐中心</text>
    <text x="60" y="65" font-family="'PingFang SC', sans-serif" font-size="20" fill="#94A3B8">电脑/手机/电视直接访问，4K原画无广告播放</text>
    <line x1="0" y1="90" x2="824" y2="90" stroke="#1E293B" stroke-width="1"/>
  </g>

  <g transform="translate(100, 620)">
    <text x="0" y="30" font-family="'PingFang SC', sans-serif" font-size="18" fill="#A78BFA" font-weight="600" letter-spacing="2">04</text>
    <text x="60" y="30" font-family="'PingFang SC', sans-serif" font-size="26" fill="#FFFFFF" font-weight="600" letter-spacing="1">隐私与安全保障</text>
    <text x="60" y="65" font-family="'PingFang SC', sans-serif" font-size="20" fill="#94A3B8">数据存储在家中硬盘，物理隔绝公有云</text>
  </g>

  <rect x="230" y="740" width="564" height="44" rx="22" fill="#F59E0B" opacity="0.1"/>
  <text x="512" y="768" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="20" fill="#F59E0B" letter-spacing="1">解决手机空间不足 · 云盘太贵 · 监控存储难</text>

  <text x="942" y="980" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="16" fill="#334155">3 / 6</text>
</svg>
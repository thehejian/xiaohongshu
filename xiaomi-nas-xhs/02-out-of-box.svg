<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="6" fill="url(#accent)"/>

  <rect x="60" y="120" width="904" height="720" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="60" y="120" width="904" height="6" rx="3" fill="url(#accent)"/>

  <text x="512" y="210" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="4">开箱即用的家庭存储中心</text>
  <line x1="380" y1="240" x2="644" y2="240" stroke="#334155" stroke-width="1"/>

  <g transform="translate(100, 300)">
    <rect x="0" y="0" width="824" height="10" fill="#F59E0B" opacity="0.3"/>
    <text x="28" y="55" font-family="'PingFang SC', sans-serif" font-size="28" fill="#F59E0B" font-weight="600" letter-spacing="2">预装硬盘套装</text>
    <text x="28" y="90" font-family="'PingFang SC', sans-serif" font-size="22" fill="#94A3B8">开箱通电即用，无需自己选购硬盘型号和品牌</text>
  </g>

  <g transform="translate(100, 430)">
    <rect x="0" y="0" width="824" height="10" fill="#3B82F6" opacity="0.3"/>
    <text x="28" y="55" font-family="'PingFang SC', sans-serif" font-size="28" fill="#60A5FA" font-weight="600" letter-spacing="2">米家App一键操控</text>
    <text x="28" y="90" font-family="'PingFang SC', sans-serif" font-size="22" fill="#94A3B8">手机完成所有设置和管理，无需电脑配置</text>
  </g>

  <g transform="translate(100, 560)">
    <rect x="0" y="0" width="824" height="10" fill="#10B981" opacity="0.3"/>
    <text x="28" y="55" font-family="'PingFang SC', sans-serif" font-size="28" fill="#34D399" font-weight="600" letter-spacing="2">去极客化设计</text>
    <text x="28" y="90" font-family="'PingFang SC', sans-serif" font-size="22" fill="#94A3B8">为家庭用户打造，不需折腾Docker和插件</text>
  </g>

  <rect x="310" y="720" width="404" height="44" rx="22" fill="#F59E0B" opacity="0.1"/>
  <text x="512" y="748" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="20" fill="#F59E0B" letter-spacing="1">双盘位设计 · 数据物理隔离</text>

  <text x="942" y="980" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="16" fill="#334155">2 / 6</text>

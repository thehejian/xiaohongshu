<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#FAF7F2"/>
  <rect x="0" y="0" width="1024" height="6" fill="#B91C1C"/>

  <rect x="60" y="180" width="904" height="600" rx="16" fill="#FFFFFF" opacity="0.88"/>
  <rect x="60" y="180" width="904" height="6" rx="3" fill="#B91C1C"/>

  <text x="512" y="310" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="48" font-weight="700" fill="#1E293B" letter-spacing="4">记住一句话</text>

  <line x1="380" y1="360" x2="644" y2="360" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="180" y="420" width="664" height="70" fill="#B91C1C" opacity="0.08"/>
  <text x="512" y="463" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="32" fill="#B91C1C" font-weight="800" letter-spacing="3">梁唐晋汉周</text>
  <text x="512" y="480" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="14" fill="#B91C1C" opacity="0.5">—</text>
  <text x="512" y="480" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="28" fill="#B91C1C" font-weight="700" letter-spacing="2">南方有十国</text>

  <text x="512" y="600" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="24" fill="#64748B" letter-spacing="1">前后共 72 年</text>
  <text x="512" y="650" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="24" fill="#64748B" letter-spacing="1">唐朝藩镇的最后一曲</text>

  <rect x="310" y="720" width="404" height="48" rx="24" fill="#B91C1C" opacity="0.08"/>
  <text x="512" y="751" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#B91C1C" letter-spacing="1">乱世出英雄</text>

  <text x="942" y="980" text-anchor="end" font-family="sans-serif" font-size="14" fill="#E2E8F0">6/6</text>
</svg>
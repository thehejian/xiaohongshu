<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#FAF7F2"/>
  <rect x="0" y="0" width="1024" height="6" fill="#B91C1C"/>

  <rect x="60" y="120" width="904" height="720" rx="16" fill="#FFFFFF" opacity="0.88"/>
  <rect x="60" y="120" width="904" height="6" rx="3" fill="#B91C1C"/>

  <text x="80" y="180" font-family="sans-serif" font-size="18" fill="#B91C1C" font-weight="700" letter-spacing="2">十国</text>

  <text x="512" y="260" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="36" font-weight="700" fill="#1E293B" letter-spacing="4">南方的十个王国</text>
  <line x1="300" y1="290" x2="724" y2="290" stroke="#E2E8F0" stroke-width="1.5"/>

  <g transform="translate(80, 330)">
    <text x="0" y="0" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#B91C1C" font-weight="700">杨吴</text>
    <text x="120" y="0" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#1E293B">南吴</text>
    <text x="240" y="0" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#B91C1C" font-weight="700">南唐</text>
    <text x="360" y="0" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#1E293B">前蜀</text>
    <text x="480" y="0" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#B91C1C" font-weight="700">后蜀</text>
  </g>
  <g transform="translate(80, 390)">
    <text x="0" y="0" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#1E293B">南汉</text>
    <text x="120" y="0" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#B91C1C" font-weight="700">南楚</text>
    <text x="240" y="0" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#1E293B">闽国</text>
    <text x="360" y="0" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#B91C1C" font-weight="700">吴越</text>
    <text x="480" y="0" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#1E293B">南平</text>
  </g>
  <g transform="translate(80, 450)">
    <text x="0" y="0" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#B91C1C" font-weight="700">北汉（山西）</text>
  </g>

  <line x1="80" y1="520" x2="944" y2="520" stroke="#E2E8F0" stroke-width="1"/>

  <text x="512" y="580" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="24" fill="#64748B" letter-spacing="2">都在南方（除北汉在山西）</text>
  <text x="512" y="630" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="24" fill="#64748B" letter-spacing="2">唐朝藩镇割据的延续</text>

  <rect x="250" y="700" width="524" height="48" rx="24" fill="#B91C1C" opacity="0.08"/>
  <text x="512" y="731" text-anchor="middle" font-family="'PingFang SC','STHeiti',sans-serif" font-size="22" fill="#B91C1C" letter-spacing="1">十国并非十个同时存在</text>

  <text x="942" y="980" text-anchor="end" font-family="sans-serif" font-size="14" fill="#E2E8F0">3/6</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="30%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="stroke">
      <feMorphology operator="dilate" radius="3" in="SourceAlpha" result="expanded"/>
      <feFlood flood-color="#000" flood-opacity="1" result="colored"/>
      <feComposite operator="in" in="colored" in2="expanded" result="stroked"/>
      <feMerge><feMergeNode in="stroked"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image href="sqz-card-2_raw.png" x="0" y="0" width="1024" height="1024" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#overlay)"/>
</svg><text x="60" y="120" fill="#B8C9D8" font-family="Source Han Serif SC" font-size="48" font-weight="700" filter="url(#stroke)">百战百胜</text><line x1="60" y1="160" x2="964" y2="160" stroke="#B8C9D8" stroke-opacity="0.4" stroke-width="1.5"/><text x="60" y="190" fill="#95A9BD" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">七十高龄仍亲自督战</text><text x="60" y="236" fill="#95A9BD" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">火攻破广陵城</text><text x="60" y="282" fill="#95A9BD" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">以少胜多，以弱胜强</text><text x="60" y="328" fill="#95A9BD" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">历经五朝屹立不倒</text><text x="60" y="374" fill="#95A9BD" font-family="Source Han Serif SC" font-size="32" font-weight="400" filter="url(#stroke)">深知功高震主从不争功</text><text x="944" y="984" fill="#95A9BD" font-family="Source Han Serif SC" font-size="18" font-weight="300" text-anchor="end" opacity="0.5">card2</text>
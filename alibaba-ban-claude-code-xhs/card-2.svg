<rect x="20" y="20" width="40" height="40" rx="20" fill="#F97316"/>
<text x="40" y="45" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">2</text>
<text x="80" y="40" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#1E293B">供应链攻击</text>
<text x="25" y="80" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="18" fill="#64748B">AI 模型下发恶意指令 → 本地 Agent 执行 → 传统杀毒无法拦截</text>
</g>
<g transform="translate(62, 500)">
<rect x="0" y="0" width="900" height="140" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
<rect x="20" y="20" width="40" height="40" rx="20" fill="#F59E0B"/>
<text x="40" y="45" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">3</text>
<text x="80" y="40" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#1E293B">数据泄露风险</text>
<text x="25" y="80" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="18" fill="#64748B">代码助手读取全部项目文件，核心算法/密钥/配置面临泄密</text>
</g>
<g transform="translate(62, 670)">
<rect x="0" y="0" width="900" height="140" rx="16" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
<rect x="20" y="20" width="40" height="40" rx="20" fill="#3B82F6"/>
<text x="40" y="45" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">4</text>
<text x="80" y="40" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#1E293B">行业连锁反应</text>
<text x="25" y="80" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="18" fill="#64748B">阿里打响第一枪，其他大厂大概率跟进 AI 工具安全审查</text>
</g>
<text x="512" y="960" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="16" fill="#94A3B8">企业级 AI 工具安全审查从加分项变成必选项</text>


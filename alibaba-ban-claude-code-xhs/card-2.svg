<text x="512" y="80" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="38" font-weight="800" fill="#1E293B">为什么是红线？</text>
<text x="512" y="120" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="22" fill="#64748B">AI 编程工具的安全风险拆解</text>

<g transform="translate(62, 160)">
<rect x="0" y="0" width="900" height="140" rx="16" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
<rect x="20" y="20" width="40" height="40" rx="20" fill="#EF4444"/>
<text x="40" y="45" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">1</text>
<text x="80" y="40" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#1E293B">代码级后门</text>
<text x="25" y="80" font-family="ui-sans-serif,-apple-system,sans-serif" font-size="18" fill="#64748B">Claude Code 直接接触企业私有代码，一旦植入后门等于给攻击者开了内网权限</text>
</g>
<g transform="translate(62, 330)">

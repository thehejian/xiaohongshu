<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F0EBE0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9331C"/>
      <stop offset="100%" stop-color="#E05530"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect x="40" y="40" width="72" height="72" rx="36" fill="url(#bar)"/>
  <text x="76" y="88" text-anchor="middle" font-family="serif" font-size="36" fill="#FAF7F2" font-weight="bold">4</text>
  <text x="140" y="85" font-family="serif" font-size="32" fill="#1E293B" font-weight="bold">冯太后其人</text>
  <text x="700" y="85" text-anchor="end" font-family="sans-serif" font-size="20" fill="#94A3B8">441-490</text>
  <line x1="40" y1="110" x2="760" y2="110" stroke="#E5DFD0" stroke-width="1"/>
  <text x="40" y="170" font-family="serif" font-size="24" fill="#475569">史载她"多智略，猜忍，</text>
  <text x="40" y="210" font-family="serif" font-size="24" fill="#475569">能行大事"。</text>
  <text x="40" y="270" font-family="serif" font-size="24" fill="#475569">手段狠辣，猜忌心重，</text>
  <text x="40" y="310" font-family="serif" font-size="24" fill="#475569">但她的人格远超</text>
  <text x="40" y="350" font-family="serif" font-size="24" fill="#475569">同时代所有人。</text>
  <text x="40" y="410" font-family="serif" font-size="24" fill="#475569">她调教了孙子孝文帝，</text>
  <text x="40" y="450" font-family="serif" font-size="24" fill="#475569">她死后，孝文帝继续她的</text>
  <text x="40" y="490" font-family="serif" font-size="24" fill="#475569">改革路线——</text>
  <text x="40" y="540" font-family="serif" font-size="24" fill="#475569">迁都洛阳、改汉姓、</text>
  <text x="40" y="580" font-family="serif" font-size="24" fill="#475569">禁胡语、穿汉服。</text>
  <rect x="40" y="620" width="720" height="60" rx="8" fill="#FDF5F0" stroke="#C9331C" stroke-width="1.5"/>
  <text x="400" y="660" text-anchor="middle" font-family="serif" font-size="22" fill="#C9331C" font-weight="bold">没有她，就没有孝文帝改革</text>
  <text x="400" y="720" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#B0A898">文明太后改革系列</text>
</svg>

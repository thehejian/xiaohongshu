<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F0EBE0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9331C"/>
      <stop offset="100%" stop-color="#E05530"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- Number badge -->
  <rect x="40" y="40" width="72" height="72" rx="36" fill="url(#bar)"/>
  <text x="76" y="88" text-anchor="middle" font-family="serif" font-size="36" fill="#FAF7F2" font-weight="bold">1</text>
  <!-- Title -->
  <text x="140" y="85" font-family="serif" font-size="32" fill="#1E293B" font-weight="bold">俸禄制</text>
  <text x="700" y="85" text-anchor="end" font-family="sans-serif" font-size="20" fill="#94A3B8">484 AD</text>
  <!-- Separator -->
  <line x1="40" y1="110" x2="760" y2="110" stroke="#E5DFD0" stroke-width="1"/>
  <!-- Content -->
  <text x="40" y="170" font-family="serif" font-size="24" fill="#475569">官员没有固定薪水，</text>
  <text x="40" y="210" font-family="serif" font-size="24" fill="#475569">贪污成了潜规则。</text>
  <text x="40" y="270" font-family="serif" font-size="24" fill="#475569">冯太后下令：按级别领工资，</text>
  <text x="40" y="310" font-family="serif" font-size="24" fill="#475569">贪污满一匹布直接处死。</text>
  <text x="40" y="370" font-family="serif" font-size="24" fill="#475569">一出手杀了40多个贪官</text>
  <text x="40" y="410" font-family="serif" font-size="24" fill="#475569">连皇亲国戚也不放过。</text>
  <!-- Highlight box -->
  <rect x="40" y="460" width="720" height="80" rx="8" fill="#FDF5F0" stroke="#C9331C" stroke-width="1.5"/>
  <text x="400" y="510" text-anchor="middle" font-family="serif" font-size="26" fill="#C9331C" font-weight="bold">从此官场风气为之一变</text>
  <!-- Footer -->
  <text x="400" y="720" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#B0A898">文明太后改革系列</text>
</svg>

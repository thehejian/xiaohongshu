<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F5ECD7"/>
      <stop offset="100%" stop-color="#D4C5A0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9331C"/>
      <stop offset="100%" stop-color="#A02010"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Decorative top bar -->
  <rect x="0" y="0" width="1024" height="12" fill="url(#accent)"/>
  <!-- Seal icon (abstract) -->
  <circle cx="512" cy="310" r="120" fill="none" stroke="#C9331C" stroke-width="4"/>
  <circle cx="512" cy="310" r="100" fill="none" stroke="#C9331C" stroke-width="2"/>
  <!-- Seal text -->
  <text x="512" y="300" text-anchor="middle" font-family="serif" font-size="72" fill="#C9331C" font-weight="bold">魏</text>
  <text x="512" y="380" text-anchor="middle" font-family="serif" font-size="56" fill="#C9331C">后</text>
  <!-- Title -->
  <text x="512" y="540" text-anchor="middle" font-family="serif" font-size="52" fill="#1E293B" font-weight="bold" letter-spacing="6">文明太后</text>
  <text x="512" y="600" text-anchor="middle" font-family="serif" font-size="36" fill="#475569" letter-spacing="4">不流血的大革命</text>
  <!-- Decorative line -->
  <line x1="312" y1="640" x2="712" y2="640" stroke="#C9331C" stroke-width="3"/>
  <!-- Subtitle -->
  <text x="512" y="700" text-anchor="middle" font-family="serif" font-size="28" fill="#64748B">北魏冯太后改革 · 中国被低估的女政治家</text>
  <!-- Bottom keywords -->
  <text x="512" y="780" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#94A3B8" letter-spacing="8">俸禄制 · 均田制 · 三长制</text>
  <!-- Footer -->
  <rect x="0" y="970" width="1024" height="12" fill="url(#accent)"/>
</svg>

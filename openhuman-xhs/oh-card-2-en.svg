<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
<radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
  <stop offset="0%" stop-color="#141B3D"/>
  <stop offset="100%" stop-color="#0B1027"/>
</radialGradient>
<linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#A855F7"/>
  <stop offset="100%" stop-color="#22D3EE"/>
</linearGradient>
<linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#EF4444"/>
  <stop offset="100%" stop-color="#FCA5A5"/>
</linearGradient>
<filter id="glow">
  <feGaussianBlur stdDeviation="3" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect width="1024" height="1024" fill="url(#bgGrad)"/>
<circle cx="0" cy="0" r="250" fill="#A855F7" opacity="0.08"/>
<circle cx="1024" cy="1024" r="350" fill="#22D3EE" opacity="0.06"/>

<g transform="translate(64, 80)">
  <rect x="0" y="0" width="6" height="32" fill="#22D3EE"/>
  <text x="20" y="18" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#22D3EE">OPENHUMAN</text>
  <text x="20" y="32" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="10" fill="#64748B">WEB COMPONENT</text>
</g>

<g transform="translate(64, 180)">
  <text x="0" y="0" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="900" fill="#F1F5F9" letter-spacing="-2">Web Component Ready</text>
  <text x="0" y="48" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#94A3B8">One HTML tag to embed a digital human</text>
</g>

<g transform="translate(64, 360)">
  <text x="0" y="0" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#22D3EE">EMBED</text>
  <rect x="0" y="20" width="896" height="100" rx="10" fill="#1E2952" opacity="0.6"/>
  <rect x="0" y="20" width="896" height="100" rx="10" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.5"/>
  <text x="24" y="60" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#22C55E">&lt;script type="module" src="https://cdn.openhuman.io/sdk/latest/embed.js"&gt;&lt;/script&gt;</text>
  <text x="24" y="95" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#22C55E">&lt;open-human src="./char.ohb" animation="idle"&gt;&lt;/open-human&gt;</text>
</g>

<g transform="translate(64, 540)">
  <text x="0" y="0" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#EF4444">SDK</text>
  <rect x="0" y="20" width="896" height="100" rx="10" fill="#1E2952" opacity="0.6"/>
  <rect x="0" y="20" width="896" height="100" rx="10" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.5"/>
  <text x="24" y="60" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#F1F5F9">import { OpenHuman } from "@openhuman/sdk"</text>
  <text x="24" y="95" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="14" fill="#F1F5F9">const human = new OpenHuman({ canvas, quality: "high" })</text>
</g>

<g transform="translate(64, 720)">
  <text x="0" y="0" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#22C55E">Attributes</text>
  <g transform="translate(0, 24)">
    <rect x="0" y="0" width="200" height="36" rx="6" fill="#1E2952" opacity="0.6"/>
    <text x="16" y="24" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#22D3EE">src</text>
    <text x="80" y="24" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#94A3B8">Character path</text>
  </g>
  <g transform="translate(220, 24)">
    <rect x="0" y="0" width="200" height="36" rx="6" fill="#1E2952" opacity="0.6"/>
    <text x="16" y="24" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#A855F7">animation</text>
    <text x="100" y="24" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#94A3B8">Initial anim</text>
  </g>
  <g transform="translate(440, 24)">
    <rect x="0" y="0" width="160" height="36" rx="6" fill="#1E2952" opacity="0.6"/>
    <text x="16" y="24" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#F59E0B">quality</text>
    <text x="80" y="24" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#94A3B8">Quality preset</text>
  </g>
</g>

<g transform="translate(64,984)">
  <text x="0" y="0" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="11" fill="#64748B">CARD 03/04</text>
  <text x="960" y="0" text-anchor="end" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="11" fill="#64748B">openhuman.ai</text>
</g>
</svg>
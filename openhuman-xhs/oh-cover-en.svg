<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
<radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
  <stop offset="0%" stop-color="#141B3D"/>
  <stop offset="100%" stop-color="#0B1027"/>
</radialGradient>
<linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#A855F7"/>
  <stop offset="100%" stop-color="#22D3EE"/>
</linearGradient>
<linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#EF4444"/>
  <stop offset="100%" stop-color="#FCA5A5"/>
</linearGradient>
<filter id="glow">
  <feGaussianBlur stdDeviation="3" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect width="1024" height="1024" fill="url(#bgGrad)"/>
<circle cx="0" cy="0" r="250" fill="#A855F7" opacity="0.08"/>
<circle cx="1024" cy="1024" r="350" fill="#22D3EE" opacity="0.06"/>

<g transform="translate(64, 80)">
  <rect x="0" y="0" width="6" height="32" fill="#22D3EE"/>
  <text x="20" y="18" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#22D3EE">OPENHUMAN</text>
  <text x="20" y="32" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="10" fill="#64748B">PURE WEBGL 2.0</text>
</g>

<g transform="translate(64, 260)">
  <text x="0" y="0" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="120" font-weight="900" fill="#F1F5F9" letter-spacing="-6">Open</text>
  <text x="0" y="130" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="120" font-weight="900" fill="url(#accentGrad)" letter-spacing="-6">Human</text>
</g>

<g transform="translate(64, 580)">
  <text x="0" y="0" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" fill="#F1F5F9">Pure WebGL 2.0</text>
  <text x="0" y="46" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#94A3B8">Digital Human Render Engine</text>
</g>

<g transform="translate(64, 720)">
  <rect x="0" y="0" width="896" height="80" rx="12" fill="#1E2952" opacity="0.6"/>
  <rect x="0" y="0" width="896" height="80" rx="12" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.4"/>
  <g transform="translate(40, 24)">
    <text x="0" y="0" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#22D3EE">Zero Deps</text>
    <text x="0" y="20" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">No Three.js / Babylon.js</text>
  </g>
  <g transform="translate(260, 24)">
    <text x="0" y="0" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#EF4444">200KB</text>
    <text x="0" y="20" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">Gzipped bundle</text>
  </g>
  <g transform="translate(480, 24)">
    <text x="0" y="0" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#22C55E">52 FACS</text>
    <text x="0" y="20" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">Facial blendshapes</text>
  </g>
  <g transform="translate(680, 24)">
    <text x="0" y="0" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#A855F7">Streaming</text>
    <text x="0" y="20" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#94A3B8">WebSocket animation</text>
  </g>
</g>

<g transform="translate(64, 840)">
  <rect x="0" y="0" width="420" height="48" rx="8" fill="#1E2952" opacity="0.7" stroke="#64748B" stroke-width="1"/>
  <text x="20" y="30" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="15" fill="#22C55E">$ npm install @openhuman/sdk</text>
</g>

<g transform="translate(64,984)">
  <text x="0" y="0" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="11" fill="#64748B">CARD 01/04</text>
  <text x="960" y="0" text-anchor="end" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="11" fill="#64748B">openhuman.ai</text>
</g>
</svg>
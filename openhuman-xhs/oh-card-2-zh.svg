<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#FAF7F2"/>
  <stop offset="100%" stop-color="#F5F0E8"/>
</linearGradient>
<linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#3B82F6"/>
  <stop offset="100%" stop-color="#2563EB"/>
</linearGradient>
<linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#DC2626"/>
  <stop offset="100%" stop-color="#F87171"/>
</linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#bgGrad)"/>
<circle cx="0" cy="0" r="300" fill="#3B82F6" opacity="0.04"/>
<circle cx="1024" cy="1024" r="400" fill="#DC2626" opacity="0.03"/>

<g transform="translate(64, 80)">
  <rect x="0" y="0" width="6" height="32" fill="#3B82F6"/>
  <text x="20" y="18" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#3B82F6">OPENHUMAN</text>
  <text x="20" y="32" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="10" fill="#94A3B8">WEB COMPONENT</text>
</g>

<g transform="translate(64, 180)">
  <text x="0" y="0" font-family="PingFang SC, Heiti SC, STHeiti, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="48" font-weight="900" fill="#1E293B" letter-spacing="-2">一行标签嵌入</text>
  <text x="0" y="50" font-family="PingFang SC, Heiti SC, STHeiti, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="22" fill="#475569">任何页面, 一个自定义元素搞定</text>
</g>

<g transform="translate(64, 360)">
  <text x="0" y="0" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#3B82F6">EMBED</text>
  <rect x="0" y="20" width="896" height="100" rx="10" fill="white" opacity="0.5"/>
  <rect x="0" y="20" width="896" height="100" rx="10" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.4"/>
  <text x="24" y="60" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="15" fill="#1E293B">&lt;script type="module" src="https://cdn.openhuman.io/sdk/latest/embed.js"&gt;&lt;/script&gt;</text>
  <text x="24" y="95" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="15" fill="#1E293B">&lt;open-human src="./char.ohb" animation="idle"&gt;&lt;/open-human&gt;</text>
</g>

<g transform="translate(64, 560)">
  <text x="0" y="0" font-family="Inter, SF Pro, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#DC2626">SDK</text>
  <rect x="0" y="20" width="896" height="100" rx="10" fill="white" opacity="0.5"/>
  <rect x="0" y="20" width="896" height="100" rx="10" fill="none" stroke="#DC2626" stroke-width="1.5" opacity="0.4"/>
  <text x="24" y="60" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="15" fill="#1E293B">import { OpenHuman } from "@openhuman/sdk"</text>
  <text x="24" y="95" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="15" fill="#1E293B">const human = new OpenHuman({ canvas, quality: "high" })</text>
</g>

<g transform="translate(64, 760)">
  <text x="0" y="0" font-family="PingFang SC, Heiti SC, STHeiti, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#059669">支持属性</text>
  <g transform="translate(0, 20)">
    <rect x="0" y="0" width="280" height="36" rx="6" fill="white" opacity="0.5"/>
    <text x="16" y="24" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#475569">src</text>
    <text x="80" y="24" font-family="PingFang SC, Heiti SC, STHeiti, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#1E293B">字符模型路径</text>
  </g>
  <g transform="translate(300, 20)">
    <rect x="0" y="0" width="180" height="36" rx="6" fill="white" opacity="0.5"/>
    <text x="16" y="24" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#475569">animation</text>
    <text x="90" y="24" font-family="PingFang SC, Heiti SC, STHeiti, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#1E293B">初始动画</text>
  </g>
  <g transform="translate(500, 20)">
    <rect x="0" y="0" width="160" height="36" rx="6" fill="white" opacity="0.5"/>
    <text x="16" y="24" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#475569">quality</text>
    <text x="72" y="24" font-family="PingFang SC, Heiti SC, STHeiti, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" fill="#1E293B">渲染质量</text>
  </g>
</g>

<g transform="translate(64,984)">
  <text x="0" y="0" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="11" fill="#94A3B8">CARD 03/04</text>
  <text x="960" y="0" text-anchor="end" font-family="SF Mono, JetBrains Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="11" fill="#94A3B8">openhuman.ai</text>
</g>
</svg>
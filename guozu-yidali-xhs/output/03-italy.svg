<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F0EAE0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <text x="512" y="90" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="30" fill="#1E293B" font-weight="bold">意大利 vs 国足 对话实录</text>
  <line x1="160" y1="110" x2="864" y2="110" stroke="#E2E8F0" stroke-width="1"/>
  <text x="160" y="180" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" fill="#059669" font-weight="bold">意大利：</text>
<text x="160" y="208" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20" fill="#1E293B">我进了，你呢？</text>
<text x="160" y="250" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" fill="#DC2626" font-weight="bold">国足：</text>
<text x="160" y="278" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20" fill="#1E293B">我……亚洲区太卷了。</text>
<text x="160" y="320" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" fill="#059669" font-weight="bold">意大利：</text>
<text x="160" y="348" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20" fill="#1E293B">欧洲也卷，但我不卷了。</text>
<text x="160" y="390" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" fill="#DC2626" font-weight="bold">国足：</text>
<text x="160" y="418" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20" fill="#1E293B">你上次不是也没进？</text>
<text x="160" y="460" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" fill="#059669" font-weight="bold">意大利：</text>
<text x="160" y="488" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20" fill="#1E293B">上次是让你们的。</text>
<text x="160" y="530" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" fill="#DC2626" font-weight="bold">国足：</text>
<text x="160" y="558" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20" fill="#1E293B">那你这次怎么不让了？</text>
<text x="160" y="600" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" fill="#059669" font-weight="bold">意大利：</text>
<text x="160" y="628" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20" fill="#1E293B">再不让你们也进不去啊。</text>
<text x="160" y="670" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" fill="#DC2626" font-weight="bold">国足：</text>
<text x="160" y="698" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20" fill="#1E293B">……</text>

  <text x="512" y="820" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" fill="#DC2626" font-weight="bold">48个名额都救不了国足</text>
  <text x="512" y="860" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#94A3B8">这回真没借口了</text>
</svg>
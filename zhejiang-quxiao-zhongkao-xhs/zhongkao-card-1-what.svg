<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F5F0E8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>

  <circle cx="80" cy="80" r="70" fill="#DBEAFE" opacity="0.4"/>
  <circle cx="720" cy="720" r="60" fill="#FEF3C7" opacity="0.3"/>

  <rect x="40" y="40" width="720" height="100" rx="50" fill="#DBEAFE" filter="url(#shadow)"/>
  <text x="400" y="108" text-anchor="middle" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#1E293B">&#x1F4F0; 发生了什么？</text>

  <g transform="translate(40, 180)">
    <rect x="0" y="0" width="720" height="140" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="360" y="45" text-anchor="middle" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#2563EB">浙江嵊泗&#xB7;取消中考选拔</text>
    <text x="40" y="85" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="18" fill="#1E293B">2025年起，取消普高录取分数线</text>
    <text x="40" y="118" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="18" fill="#64748B">所有初中毕业生100%升入普通高中</text>
  </g>

  <g transform="translate(40, 355)">
    <rect x="0" y="0" width="340" height="160" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="340" height="50" rx="20" fill="#D1FAE5"/>
    <text x="170" y="33" text-anchor="middle" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#059669">&#x2705; 不是取消考试</text>
    <text x="20" y="80" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="16" fill="#64748B">学生仍需参加全省中考</text>
    <text x="20" y="110" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="16" fill="#64748B">取消的是"选拔功能"</text>
  </g>

  <g transform="translate(420, 355)">
    <rect x="0" y="0" width="340" height="160" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="340" height="50" rx="20" fill="#FEF3C7"/>
    <text x="170" y="33" text-anchor="middle" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#D97706">&#x1F3ED; 全员直升</text>
    <text x="20" y="80" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="16" fill="#64748B">通过学业水平考试即可</text>
    <text x="20" y="110" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="16" fill="#64748B">100%升入普高</text>
  </g>

  <g transform="translate(40, 550)">
    <rect x="0" y="0" width="340" height="160" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="340" height="50" rx="20" fill="#EDE9FE"/>
    <text x="170" y="33" text-anchor="middle" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#7C3AED">&#x1F4C5; 高一后分方向</text>
    <text x="20" y="80" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="16" fill="#64748B">高一结束后自主选择</text>
    <text x="20" y="110" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="16" fill="#64748B">文科/理科发展方向</text>
  </g>

  <g transform="translate(420, 550)">
    <rect x="0" y="0" width="340" height="160" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="340" height="50" rx="20" fill="#FCE7F3"/>
    <text x="170" y="33" text-anchor="middle" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#EC4899">&#x1F4AC; 冲上热搜</text>
    <text x="20" y="80" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="16" fill="#64748B">2026.6.14登上热搜第一</text>
    <text x="20" y="110" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="16" fill="#64748B">全网讨论中</text>
  </g>

  <g transform="translate(40, 745)">
    <rect x="0" y="0" width="720" height="35" rx="17" fill="#FEE2E2"/>
    <text x="360" y="24" text-anchor="middle" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#DC2626">&#x1F525; 一考定终身的模式正在被打破</text>
  </g>
</svg>
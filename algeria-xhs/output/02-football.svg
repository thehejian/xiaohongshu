  <text x="30" y="75" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">马赫雷斯决赛任意球绝杀塞内加尔</text>
  <text x="30" y="105" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">7战全胜 · 0失球 · 最完美冠军之路</text>
</g>

<g transform="translate(62, 440)">
  <rect x="0" y="0" width="900" height="120" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="0" y="0" width="6" height="120" rx="3" fill="#006633"/>
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#006633">马赫雷斯 · 阿尔及利亚队长</text>
  <text x="30" y="75" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">曼城英超四连冠核心 · PFA最佳球员</text>
  <text x="30" y="105" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">"最骄傲的身份永远是阿尔及利亚队长"</text>
</g>

<g transform="translate(62, 590)">

  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#D4A843">齐达内 · 根在阿尔及利亚</text>
  <text x="30" y="75" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">齐祖父亲是阿尔及利亚卡比利亚人 · 血脉永不断</text>
</g>

<rect x="62" y="730" width="900" height="70" rx="20" fill="#E8F5E9" stroke="#006633" stroke-width="1.5"/>
<text x="512" y="765" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="22" font-weight="800" fill="#006633">北非雄狮 · 世界足坛不敢小看的名字</text>

<rect x="312" y="840" width="400" height="50" rx="25" fill="#006633"/>

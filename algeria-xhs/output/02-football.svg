<text x="512" y="990" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#94A3B8">#阿尔及利亚足球 #马赫雷斯 #齐达内 #世界杯 #非洲杯</text>

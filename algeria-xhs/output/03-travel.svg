<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <radialGradient id="bg" cx="50%" cy="40%" r="70%">
    <stop offset="0%" stop-color="#FAF7F2"/>
    <stop offset="100%" stop-color="#F5F0E8"/>
  </radialGradient>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.08"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<circle cx="80" cy="80" r="80" fill="#FEF9E7" opacity="0.2"/>
<circle cx="924" cy="924" r="120" fill="#E8F5E9" opacity="0.15"/>

<rect x="62" y="30" width="900" height="80" rx="35" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="512" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="30" font-weight="800" fill="#1E293B">🌍 阿尔及利亚 · 旅行宝藏</text>

<g transform="translate(62, 140)">
  <rect x="0" y="0" width="900" height="130" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B">🏰 阿尔及尔 · 白色之城</text>
  <text x="30" y="75" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">白房子依山而建，面朝地中海</text>
  <text x="30" y="105" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">像圣托里尼，但没游客 · 物价只有摩洛哥一半</text>
</g>

<g transform="translate(62, 300)">
  <rect x="0" y="0" width="900" height="130" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B">🏛 卡斯巴老城 · 世界遗产</text>
  <text x="30" y="75" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">奥斯曼时期窄巷迷宫 · 每一步都是历史</text>
  <text x="30" y="105" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">当地人会拉你喝薄荷茶 · 不喝完三杯走不掉</text>
</g>

<g transform="translate(62, 460)">
  <rect x="0" y="0" width="900" height="130" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B">🏞 古罗马遗址</text>
  <text x="30" y="75" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">提姆加德 · 杰米拉 · 北非保存最完整</text>
  <text x="30" y="105" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">站在两千年前的街道上 · 能听到历史的声音</text>
</g>

<g transform="translate(62, 620)">
  <rect x="0" y="0" width="900" height="100" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#1E293B">🍲 阿尔及利亚美食</text>
  <text x="30" y="75" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#64748B">古斯古斯国菜 · Mechoui烤全羊 · 法棍比巴黎正宗</text>
</g>

<rect x="62" y="760" width="900" height="70" rx="20" fill="#FEF9E7" stroke="#D4A843" stroke-width="1.5"/>
<text x="512" y="795" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="22" font-weight="800" fill="#D4A843">签证在放开口子 · 趁人少赶紧去</text>

<rect x="312" y="870" width="400" height="50" rx="25" fill="#006633"/>
<text x="512" y="903" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#FFF">下翻  →  撒哈拉</text>
<line x1="80" y1="960" x2="944" y2="960" stroke="#E2E8F0" stroke-width="1"/>
<text x="512" y="990" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#94A3B8">#阿尔及利亚旅行 #北非 #地中海 #卡斯巴 #古罗马遗址</text>
</svg>
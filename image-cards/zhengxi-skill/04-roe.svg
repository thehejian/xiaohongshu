<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#FAF7F2"/>
  <rect x="0" y="0" width="1024" height="8" fill="#E8655A"/>

  <g filter="url(#shadow)">
    <rect x="80" y="200" width="864" height="560" rx="16" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <text x="512" y="290" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="52" font-weight="700" fill="#1E293B" letter-spacing="2">核心选股：ROE弹性</text>
  <line x1="380" y1="320" x2="644" y2="320" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- A类 -->
  <g transform="translate(114, 360)">
    <rect x="0" y="0" width="370" height="200" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="50" rx="14" fill="#E8655A"/>
    <rect x="0" y="36" width="370" height="14" fill="#E8655A"/>
    <text x="185" y="34" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="24" fill="#FFFFFF" font-weight="700">A类  行业压制型</text>
    <text x="28" y="90" font-family="'PingFang SC', sans-serif" font-size="24" fill="#1E293B" font-weight="500">ROE低因为行业差</text>
    <text x="28" y="128" font-family="'PingFang SC', sans-serif" font-size="24" fill="#1E293B" font-weight="500">景气来临时修复弹性极大</text>
    <text x="28" y="166" font-family="'PingFang SC', sans-serif" font-size="20" fill="#94A3B8">如MLCC涨价时的风华高科</text>
  </g>

  <!-- B类 -->
  <g transform="translate(540, 360)">
    <rect x="0" y="0" width="370" height="200" rx="14" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="50" rx="14" fill="#0EA5E9"/>
    <rect x="0" y="36" width="370" height="14" fill="#0EA5E9"/>
    <text x="185" y="34" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="24" fill="#FFFFFF" font-weight="700">B类  前瞻研发型</text>
    <text x="28" y="90" font-family="'PingFang SC', sans-serif" font-size="24" fill="#1E293B" font-weight="500">研发方向与景气一致</text>
    <text x="28" y="128" font-family="'PingFang SC', sans-serif" font-size="24" fill="#1E293B" font-weight="500">产品卖出时回报放大</text>
    <text x="28" y="166" font-family="'PingFang SC', sans-serif" font-size="20" fill="#94A3B8">中小标的弹性更大</text>
  </g>

  <!-- Note -->
  <rect x="130" y="620" width="764" height="50" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M195,638 L205,648 M205,638 L195,648" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <text x="220" y="651" font-family="'PingFang SC', sans-serif" font-size="22" fill="#94A3B8">排除：ROE高因杠杆，或管理层差</text>
  <polygon points="710,647 725,642 725,652" fill="#94A3B8"/>
  <text x="738" y="651" font-family="'PingFang SC', sans-serif" font-size="22" fill="#94A3B8">不碰</text>

  <text x="942" y="980" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="18" fill="#CBD5E1">4 / 6</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#FAF7F2" rx="0"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1024" height="8" fill="#E8655A"/>

  <!-- Subtle corner decoration -->
  <circle cx="920" cy="920" r="180" fill="#E8655A" opacity="0.04"/>
  <circle cx="104" cy="104" r="120" fill="#E8655A" opacity="0.03"/>

  <!-- Decorative light grid lines -->
  <line x1="60" y1="200" x2="964" y2="200" stroke="#E2E8F0" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="420" x2="964" y2="420" stroke="#E2E8F0" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="640" x2="964" y2="640" stroke="#E2E8F0" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="860" x2="964" y2="860" stroke="#E2E8F0" stroke-width="1" opacity="0.5"/>

  <!-- Main content area -->
  <g filter="url(#shadow)">
    <rect x="80" y="200" width="864" height="560" rx="16" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Title -->
  <text x="512" y="300" text-anchor="middle" font-family="'PingFang SC', 'STHeiti', 'Noto Sans SC', sans-serif" font-size="72" font-weight="700" fill="#1E293B" letter-spacing="4">
    让AI学会
  </text>
  <text x="512" y="390" text-anchor="middle" font-family="'PingFang SC', 'STHeiti', 'Noto Sans SC', sans-serif" font-size="72" font-weight="700" fill="#E8655A" letter-spacing="6">
    景气度投资
  </text>

  <!-- Divider -->
  <line x1="380" y1="445" x2="644" y2="445" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtitle -->
  <text x="512" y="500" text-anchor="middle" font-family="'PingFang SC', 'STHeiti', 'Noto Sans SC', sans-serif" font-size="32" fill="#64748B" letter-spacing="2">
    把基金经理方法论做成 Agent Skill
  </text>

  <!-- Tag badges -->
  <rect x="310" y="555" width="130" height="36" rx="18" fill="#E8655A" opacity="0.1"/>
  <text x="375" y="579" text-anchor="middle" font-family="'PingFang SC', 'STHeiti', sans-serif" font-size="20" fill="#E8655A" font-weight="500">
    开源
  </text>

  <rect x="458" y="555" width="130" height="36" rx="18" fill="#0EA5E9" opacity="0.1"/>
  <text x="523" y="579" text-anchor="middle" font-family="'PingFang SC', 'STHeiti', sans-serif" font-size="20" fill="#0EA5E9" font-weight="500">
    免费
  </text>

  <rect x="606" y="555" width="130" height="36" rx="18" fill="#10B981" opacity="0.1"/>
  <text x="671" y="579" text-anchor="middle" font-family="'PingFang SC', 'STHeiti', sans-serif" font-size="20" fill="#10B981" font-weight="500">
    GitHub
  </text>

  <!-- Footer -->
  <text x="512" y="680" text-anchor="middle" font-family="'PingFang SC', 'STHeiti', sans-serif" font-size="22" fill="#94A3B8" letter-spacing="1">
    github.com/JadenLuo18/zhengxi-skill
  </text>

  <!-- Page indicator -->
  <text x="942" y="980" text-anchor="end" font-family="'PingFang SC', 'STHeiti', sans-serif" font-size="18" fill="#CBD5E1" font-weight="500">
    1 / 6
  </text>
</svg>
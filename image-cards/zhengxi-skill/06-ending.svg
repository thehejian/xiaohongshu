<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#FAF7F2"/>
  <rect x="0" y="0" width="1024" height="8" fill="#E8655A"/>

  <circle cx="920" cy="920" r="180" fill="#E8655A" opacity="0.04"/>
  <circle cx="104" cy="104" r="120" fill="#E8655A" opacity="0.03"/>

  <g filter="url(#shadow)">
    <rect x="80" y="240" width="864" height="480" rx="16" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <text x="512" y="340" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="56" font-weight="700" fill="#E8655A" letter-spacing="2">不是荐股</text>
  <text x="512" y="420" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="56" font-weight="700" fill="#1E293B" letter-spacing="2">是研究工具</text>

  <line x1="380" y1="470" x2="644" y2="470" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

  <g transform="translate(130, 510)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#E8655A" opacity="0.4"/>
    <text x="28" y="14" font-family="'PingFang SC', sans-serif" font-size="26" fill="#475569">研究辅助，非投资建议</text>
  </g>
  <g transform="translate(130, 560)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#0EA5E9" opacity="0.4"/>
    <text x="28" y="14" font-family="'PingFang SC', sans-serif" font-size="26" fill="#475569">所有判断回到公告和财报</text>
  </g>
  <g transform="translate(130, 610)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#10B981" opacity="0.4"/>
    <text x="28" y="14" font-family="'PingFang SC', sans-serif" font-size="26" fill="#475569">交易决策始终由你控制</text>
  </g>

  <text x="512" y="690" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="26" fill="#E8655A" font-weight="500">评论区说说你用的什么AI投研工具</text>

  <text x="942" y="980" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="18" fill="#CBD5E1">6 / 6</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#FAF7F2"/>
  <rect x="0" y="0" width="1024" height="8" fill="#E8655A"/>

  <g filter="url(#shadow)">
    <rect x="80" y="200" width="864" height="560" rx="16" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <text x="512" y="300" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="56" font-weight="700" fill="#1E293B" letter-spacing="2">刷到热点，从哪下手？</text>

  <line x1="380" y1="340" x2="644" y2="340" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

  <g transform="translate(130, 390)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#E8655A" opacity="0.15"/>
    <text x="16" y="22" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#E8655A" font-weight="700">1</text>
    <text x="48" y="24" font-family="'PingFang SC', sans-serif" font-size="30" fill="#475569">看到AI算力、半导体涨价</text>
  </g>
  <g transform="translate(130, 460)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#E8655A" opacity="0.15"/>
    <text x="16" y="22" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#E8655A" font-weight="700">2</text>
    <text x="48" y="24" font-family="'PingFang SC', sans-serif" font-size="30" fill="#475569">但很难判断哪层产业链在涨价</text>
  </g>
  <g transform="translate(130, 530)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#E8655A" opacity="0.15"/>
    <text x="16" y="22" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#E8655A" font-weight="700">3</text>
    <text x="48" y="24" font-family="'PingFang SC', sans-serif" font-size="30" fill="#475569">哪个环节扩产最难？</text>
  </g>
  <g transform="translate(130, 600)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#E8655A" opacity="0.15"/>
    <text x="16" y="22" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#E8655A" font-weight="700">4</text>
    <text x="48" y="24" font-family="'PingFang SC', sans-serif" font-size="30" fill="#475569">哪些公司ROE还有弹性？</text>
  </g>

  <rect x="130" y="660" width="764" height="56" rx="12" fill="#E8655A" opacity="0.08"/>
  <text x="512" y="695" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="26" fill="#E8655A" font-weight="600">郑希框架帮AI完成第一轮深度研究</text>

  <text x="942" y="980" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="18" fill="#CBD5E1">2 / 6</text>
</svg>
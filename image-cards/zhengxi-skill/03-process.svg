<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#FAF7F2"/>
  <rect x="0" y="0" width="1024" height="8" fill="#E8655A"/>

  <g filter="url(#shadow)">
    <rect x="80" y="160" width="864" height="680" rx="16" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <text x="512" y="240" text-anchor="middle" font-family="'PingFang SC', sans-serif" font-size="52" font-weight="700" fill="#1E293B" letter-spacing="2">四步研究流程</text>

  <line x1="420" y1="270" x2="604" y2="270" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Step 1 -->
  <g transform="translate(130, 310)">
    <rect x="0" y="0" width="764" height="95" rx="12" fill="#E8655A" opacity="0.06"/>
    <rect x="0" y="0" width="6" height="95" rx="3" fill="#E8655A"/>
    <text x="28" y="38" font-family="'PingFang SC', sans-serif" font-size="28" fill="#E8655A" font-weight="700">01 全球图谱定景气方向</text>
    <text x="28" y="72" font-family="'PingFang SC', sans-serif" font-size="22" fill="#64748B">识别系统变化 → 画产业链图谱 → 找通胀层</text>
  </g>

  <!-- Arrow 1 -->
  <polygon points="512,405 504,420 520,420" fill="#CBD5E1"/>

  <!-- Step 2 -->
  <g transform="translate(130, 430)">
    <rect x="0" y="0" width="764" height="95" rx="12" fill="#0EA5E9" opacity="0.06"/>
    <rect x="0" y="0" width="6" height="95" rx="3" fill="#0EA5E9"/>
    <text x="28" y="38" font-family="'PingFang SC', sans-serif" font-size="28" fill="#0EA5E9" font-weight="700">02 选ROE低的公司</text>
    <text x="28" y="72" font-family="'PingFang SC', sans-serif" font-size="22" fill="#64748B">行业压制型(A类) + 前瞻研发型(B类)</text>
  </g>

  <!-- Arrow 2 -->
  <polygon points="512,525 504,540 520,540" fill="#CBD5E1"/>

  <!-- Step 3 -->
  <g transform="translate(130, 550)">
    <rect x="0" y="0" width="764" height="95" rx="12" fill="#10B981" opacity="0.06"/>
    <rect x="0" y="0" width="6" height="95" rx="3" fill="#10B981"/>
    <text x="28" y="38" font-family="'PingFang SC', sans-serif" font-size="28" fill="#10B981" font-weight="700">03 六维跟踪验证</text>
    <text x="28" y="72" font-family="'PingFang SC', sans-serif" font-size="22" fill="#64748B">竞争对手·上游·下游·价格·新进入者·预期</text>
  </g>

  <!-- Arrow 3 -->
  <polygon points="512,645 504,660 520,660" fill="#CBD5E1"/>

  <!-- Step 4 -->
  <g transform="translate(130, 670)">
    <rect x="0" y="0" width="764" height="95" rx="12" fill="#E8655A" opacity="0.15"/>
    <rect x="0" y="0" width="6" height="95" rx="3" fill="#E8655A"/>
    <text x="28" y="38" font-family="'PingFang SC', sans-serif" font-size="28" fill="#E8655A" font-weight="700">04 逐步拟合 · 不一步到位</text>
    <text x="28" y="72" font-family="'PingFang SC', sans-serif" font-size="22" fill="#64748B">未启动 → 试水 → 拟合 → 成型 → 顶部</text>
  </g>

  <text x="942" y="980" text-anchor="end" font-family="'PingFang SC', sans-serif" font-size="18" fill="#CBD5E1">3 / 6</text>
</svg>
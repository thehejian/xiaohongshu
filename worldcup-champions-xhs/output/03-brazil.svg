<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#FAF7F2"/>
  <text x="512" y="100" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="40" fill="#1E293B" font-weight="bold">巴西</text>
  <text x="512" y="150" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="100" fill="#059669" font-weight="bold">5</text>
  <text x="512" y="200" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20" fill="#94A3B8">次冠军 · 历史第一</text>
  <text x="512" y="280" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="22" fill="#1E293B" font-weight="bold">1958 1962 1970 1994 2002</text>
  <text x="512" y="350" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20" fill="#1E293B">球王贝利 · 3次夺冠（历史唯一）</text>
  <text x="512" y="390" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="20" fill="#1E293B">唯一参加过全部22届世界杯的国家</text>
  <line x1="200" y1="450" x2="824" y2="450" stroke="#E2E8F0" stroke-width="1"/>
  <text x="512" y="510" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#94A3B8">2002年决赛 2:0 德国</text>
  <text x="512" y="550" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#94A3B8">2014年半决赛 1:7 德国（史上最惨）</text>
  <text x="512" y="590" text-anchor="middle" font-family="PingFang SC, Heiti SC, sans-serif" font-size="18" fill="#94A3B8">2026年等待第6冠</text>
</svg>
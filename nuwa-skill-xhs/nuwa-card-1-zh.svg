<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FAF7F2"/>
    <stop offset="100%" stop-color="#F5F0E8"/>
  </linearGradient>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.08"/>
  </filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<circle cx="100" cy="100" r="80" fill="#FEE2E2" opacity="0.3"/>
<circle cx="924" cy="924" r="70" fill="#EDE9FE" opacity="0.3"/>
<rect x="40" y="30" width="944" height="100" rx="40" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="512" y="95" text-anchor="middle" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#1E293B">输入一个名字，6 路同时开工</text>
<g transform="translate(40, 170)">
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="452" height="120" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="120" rx="4" fill="#DC2626"/>
    <text x="30" y="50" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#DC2626">01 · 著作</text>
    <text x="30" y="88" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="20" fill="#64748B">读遍他写的所有书和长文</text>
  </g>
  <g transform="translate(480, 0)">
    <rect x="0" y="0" width="452" height="120" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="120" rx="4" fill="#7C3AED"/>
    <text x="30" y="50" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#7C3AED">02 · 播客访谈</text>
    <text x="30" y="88" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="20" fill="#64748B">扒他所有公开演讲和深度对话</text>
  </g>
  <g transform="translate(0, 150)">
    <rect x="0" y="0" width="452" height="120" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="120" rx="4" fill="#F59E0B"/>
    <text x="30" y="50" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#F59E0B">03 · 社交媒体</text>
    <text x="30" y="88" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="20" fill="#64748B">翻他所有推文、微博、博客动态</text>
  </g>
  <g transform="translate(480, 150)">
    <rect x="0" y="0" width="452" height="120" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="120" rx="4" fill="#06B6D4"/>
    <text x="30" y="50" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#06B6D4">04 · 他者视角</text>
    <text x="30" y="88" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="20" fill="#64748B">找批评者是怎么评价他的</text>
  </g>
  <g transform="translate(0, 300)">
    <rect x="0" y="0" width="452" height="120" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="120" rx="4" fill="#10B981"/>
    <text x="30" y="50" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#10B981">05 · 决策记录</text>
    <text x="30" y="88" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="20" fill="#64748B">扒他做过哪些关键决策</text>
  </g>
  <g transform="translate(480, 300)">
    <rect x="0" y="0" width="452" height="120" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="8" height="120" rx="4" fill="#EA580C"/>
    <text x="30" y="50" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#EA580C">06 · 时间线</text>
    <text x="30" y="88" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="20" fill="#64748B">拉一条完整人生时间线</text>
  </g>
</g>
<g transform="translate(40, 910)">
  <rect x="0" y="0" width="944" height="60" rx="30" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="472" y="39" text-anchor="middle" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#DC2626">6 路并进，每路存档，跑完统一进提炼</text>
</g>
<text x="512" y="1000" text-anchor="middle" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#94A3B8">github.com/alchaincyf/nuwa-skill</text>
</svg>